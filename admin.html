<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rimi Admin</title>

<style>
:root{
--burgundy:#741b35;
--dark:#541024;
--cream:#fffaf0;
--yellow:#fff3bd;
--white:#ffffff;
--text:#4c2730;
--border:#ead9b9;
}

*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:var(--cream);
color:var(--text);
}

.hidden{display:none!important}

header{
background:var(--burgundy);
color:white;
padding:16px;
display:flex;
align-items:center;
justify-content:space-between;
}

header h1{
margin:0;
font-size:24px;
}

.container{
width:min(1000px,92%);
margin:25px auto;
}

.card{
background:white;
border:1px solid var(--border);
border-radius:20px;
padding:20px;
margin-bottom:18px;
box-shadow:0 5px 20px #0000000b;
}

.login-card{
width:min(430px,92%);
margin:70px auto;
}

h2,h3{
color:var(--burgundy);
}

label{
display:block;
margin:12px 0 6px;
font-weight:bold;
}

input,textarea,select{
width:100%;
padding:13px;
border:1px solid var(--border);
border-radius:12px;
background:white;
font:inherit;
}

textarea{
min-height:100px;
resize:vertical;
}

button{
cursor:pointer;
border:0;
font:inherit;
}

.btn{
background:var(--burgundy);
color:white;
padding:12px 18px;
border-radius:12px;
margin-top:12px;
}

.btn:hover{
background:var(--dark);
}

.btn-light{
background:var(--yellow);
color:var(--dark);
}

.btn-danger{
background:#a63245;
color:white;
}

.message{
margin-top:14px;
padding:12px;
border-radius:10px;
background:var(--yellow);
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.item{
border:1px solid var(--border);
border-radius:14px;
padding:14px;
margin:10px 0;
}

.item-actions{
display:flex;
gap:8px;
flex-wrap:wrap;
}

.checks{
display:flex;
gap:18px;
flex-wrap:wrap;
margin-top:14px;
}

.checks label{
display:flex;
align-items:center;
gap:7px;
margin:0;
}

.checks input{
width:auto;
}

.product-img{
width:90px;
height:90px;
border-radius:12px;
object-fit:cover;
border:1px solid var(--border);
}

.top-row{
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
}

small{
opacity:.75;
}

@media(max-width:650px){
.grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<section id="loginScreen">
<div class="card login-card">

<h2>Rimi Admin 🎀</h2>
<p>تسجيل دخول الإدارة</p>

<label>البريد الإلكتروني</label>
<input id="email" type="email" autocomplete="username">

<label>كلمة المرور</label>
<input id="password" type="password" autocomplete="current-password">

<button id="loginBtn" class="btn">
دخول
</button>

<div id="loginMessage" class="message hidden"></div>

</div>
</section>


<section id="adminScreen" class="hidden">

<header>
<h1>Rimi Admin 🎀</h1>

<button id="logoutBtn" class="btn btn-light">
تسجيل الخروج
</button>
</header>

<div class="container">

<div class="card">
<h2>الأقسام</h2>

<label>اسم القسم</label>
<input
id="categoryName"
placeholder="مثال: شنط"
>

<label>ترتيب القسم</label>
<input
id="categoryOrder"
type="number"
value="1"
min="1"
>

<button id="addCategoryBtn" class="btn">
إضافة القسم
</button>

<div id="categoryMessage" class="message hidden"></div>

<hr>

<h3>الأقسام الحالية</h3>
<div id="categoriesBox">
جاري التحميل...
</div>
</div>


<div class="card">

<h2 id="productFormTitle">
إضافة منتج
</h2>

<div class="grid">

<div>
<label>اسم المنتج</label>
<input id="productName">
</div>

<div>
<label>القسم</label>
<select id="productCategory">
<option value="">اختاري القسم</option>
</select>
</div>

<div>
<label>السعر (ر.ع)</label>
<input
id="productPrice"
type="number"
step="0.001"
min="0"
>
</div>

<div>
<label>الكمية المتوفرة</label>
<input
id="productStock"
type="number"
min="0"
value="0"
>
</div>

</div>


<label>وصف المنتج</label>
<textarea
id="productDescription"
placeholder="اكتبي وصف المنتج"
></textarea>


<label>الألوان</label>
<input
id="productColors"
placeholder="مثال: بني، أسود، أزرق"
>
<small>
افصلي بين الألوان بفاصلة.
</small>


<label>المقاسات</label>
<input
id="productSizes"
placeholder="مثال: S، M، L"
>
<small>
إذا المنتج ما له مقاسات اتركيه فارغًا.
</small>


<label>رابط صورة المنتج</label>
<input
id="productImage"
type="url"
placeholder="https://..."
>

<div class="checks">

<label>
<input
id="productActive"
type="checkbox"
checked
>
متوفر
</label>

<label>
<input
id="productNew"
type="checkbox"
>
جديد
</label>

<label>
<input
id="productFeatured"
type="checkbox"
>
مميز
</label>

</div>


<button id="saveProductBtn" class="btn">
حفظ المنتج
</button>

<button
id="cancelEditBtn"
class="btn btn-light hidden"
>
إلغاء التعديل
</button>

<div id="productMessage" class="message hidden"></div>

</div>


<div class="card">

<div class="top-row">
<h2>المنتجات</h2>

<button
id="refreshProductsBtn"
class="btn btn-light"
>
تحديث
</button>
</div>

<div id="productsBox">
جاري التحميل...
</div>

</div>

</div>
</section>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
doc,
deleteDoc,
updateDoc,
serverTimestamp,
query,
orderBy
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


const firebaseConfig = {
apiKey: "AIzaSyAtBFypkQdyayn1F-Fxxpd04UD7kWFXBu4",
authDomain: "rimi-store.firebaseapp.com",
projectId: "rimi-store",
storageBucket: "rimi-store.firebasestorage.app",
messagingSenderId: "1640224406",
appId: "1:1640224406:web:c59fd821a5e91317aed4b7"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
  const ADMIN_UID = "ESiJxuZmIuMHTmvLWpez9s79tQt2";

const $ = id => document.getElementById(id);

let categories = [];
let products = [];
let editingProductId = null;


function showMessage(element,text){

element.textContent=text;
element.classList.remove("hidden");

setTimeout(()=>{
element.classList.add("hidden");
},4000);
}


$("loginBtn").onclick = async ()=>{

const email=$("email").value.trim();
const password=$("password").value;

if(!email || !password){
showMessage(
$("loginMessage"),
"اكتبي البريد وكلمة المرور."
);
return;
}

$("loginBtn").disabled=true;
$("loginBtn").textContent="جاري الدخول...";

try{

await signInWithEmailAndPassword(
auth,
email,
password
);

}catch(error){

console.error(error);

showMessage(
$("loginMessage"),
"خطأ Firebase: " + error.code
);

}finally{

$("loginBtn").disabled=false;
$("loginBtn").textContent="دخول";
}
};


$("password").addEventListener("keydown",event=>{

if(event.key==="Enter"){
$("loginBtn").click();
}

});


$("logoutBtn").onclick = async ()=>{

await signOut(auth);

};


onAuthStateChanged(auth,async user=>{

if(user){

$("loginScreen").classList.add("hidden");
$("adminScreen").classList.remove("hidden");

await loadCategories();
await loadProducts();

}else{

$("adminScreen").classList.add("hidden");
$("loginScreen").classList.remove("hidden");

}

});


$("addCategoryBtn").onclick = async ()=>{

const name=$("categoryName").value.trim();
const order=Number($("categoryOrder").value)||1;

if(!name){

showMessage(
$("categoryMessage"),
"اكتبي اسم القسم."
);

return;
}

try{

await addDoc(
collection(db,"categories"),
{
name,
order,
active:true,
createdAt:serverTimestamp()
}
);

$("categoryName").value="";
$("categoryOrder").value="1";

showMessage(
$("categoryMessage"),
"تمت إضافة القسم ✓"
);

await loadCategories();

}catch(error){

console.error(error);

showMessage(
$("categoryMessage"),
"تعذر إضافة القسم. سنراجع صلاحيات Firestore."
);
}
};


async function loadCategories(){

categories=[];

try{

const snap=await getDocs(
query(
collection(db,"categories"),
orderBy("order")
)
);

snap.forEach(d=>{

categories.push({
id:d.id,
...d.data()
});

});

renderCategories();
fillCategorySelect();

}catch(error){

console.error(error);

$("categoriesBox").textContent=
"تعذر تحميل الأقسام.";

}
}


function renderCategories(){

const box=$("categoriesBox");

if(!categories.length){

box.innerHTML=
"<p>ما فيه أقسام حتى الآن.</p>";

return;
}

box.innerHTML=categories.map(cat=>`

<div class="item">

<strong>
${escapeHtml(cat.name)}
</strong>

<p>
الترتيب:
${Number(cat.order)||1}
</p>

<button
class="btn btn-danger"
data-delete-category="${cat.id}"
>
حذف
</button>

</div>

`).join("");


box
.querySelectorAll("[data-delete-category]")
.forEach(btn=>{

btn.onclick=async ()=>{

if(!confirm("هل تريدين حذف هذا القسم؟")){
return;
}

try{

await deleteDoc(
doc(
db,
"categories",
btn.dataset.deleteCategory
)
);

await loadCategories();

}catch(error){

console.error(error);

alert("تعذر حذف القسم.");

}

};

});
}


function fillCategorySelect(){

const select=$("productCategory");
const current=select.value;

select.innerHTML=
'<option value="">اختاري القسم</option>'+
categories.map(cat=>
`<option value="${cat.id}">
${escapeHtml(cat.name)}
</option>`
).join("");

select.value=current;
}


$("saveProductBtn").onclick = async ()=>{

const name=$("productName").value.trim();
const categoryId=$("productCategory").value;
const price=Number($("productPrice").value);

if(!name){

showMessage(
$("productMessage"),
"اكتبي اسم المنتج."
);

return;
}

if(!categoryId){

showMessage(
$("productMessage"),
"اختاري القسم."
);

return;
}

if(Number.isNaN(price)){

showMessage(
$("productMessage"),
"اكتبي السعر."
);

return;
}


const data={

name,
categoryId,
price,

stock:
Number($("productStock").value)||0,

description:
$("productDescription").value.trim(),

colors:
splitValues($("productColors").value),

sizes:
splitValues($("productSizes").value),

image:
$("productImage").value.trim(),

active:
$("productActive").checked,

isNew:
$("productNew").checked,

featured:
$("productFeatured").checked,

updatedAt:
serverTimestamp()

};


try{

if(editingProductId){

await updateDoc(
doc(
db,
"products",
editingProductId
),
data
);

showMessage(
$("productMessage"),
"تم تعديل المنتج ✓"
);

}else{

data.createdAt=serverTimestamp();

await addDoc(
collection(db,"products"),
data
);

showMessage(
$("productMessage"),
"تمت إضافة المنتج ✓"
);

}

resetProductForm();

await loadProducts();

}catch(error){

console.error(error);

showMessage(
$("productMessage"),
"تعذر حفظ المنتج. سنراجع صلاحيات Firestore."
);

}
};


async function loadProducts(){

products=[];

try{

const snap=await getDocs(
collection(db,"products")
);

snap.forEach(d=>{

products.push({
id:d.id,
...d.data()
});

});

renderProducts();

}catch(error){

console.error(error);

$("productsBox").textContent=
"تعذر تحميل المنتجات.";

}
}


function renderProducts(){

const box=$("productsBox");

if(!products.length){

box.innerHTML=
"<p>ما فيه منتجات حتى الآن.</p>";

return;
}


box.innerHTML=products.map(product=>{

const category=
categories.find(
cat=>cat.id===product.categoryId
);

return `

<div class="item">

<div class="top-row">

<div>

<strong>
${escapeHtml(product.name)}
</strong>

<p>
القسم:
${escapeHtml(
category?.name || "غير محدد"
)}
</p>

<p>
السعر:
${Number(product.price || 0).toFixed(3)}
ر.ع
</p>

<p>
المخزون:
${Number(product.stock || 0)}
</p>

</div>

${
product.image
?
`<img
class="product-img"
src="${escapeHtml(product.image)}"
alt=""
>`
:
""
}

</div>


<div class="item-actions">

<button
class="btn"
data-edit-product="${product.id}"
>
تعديل
</button>

<button
class="btn btn-danger"
data-delete-product="${product.id}"
>
حذف
</button>

</div>

</div>

`;

}).join("");


box
.querySelectorAll("[data-edit-product]")
.forEach(btn=>{

btn.onclick=()=>{

startProductEdit(
btn.dataset.editProduct
);

};

});


box
.querySelectorAll("[data-delete-product]")
.forEach(btn=>{

btn.onclick=async ()=>{

if(!confirm("هل تريدين حذف هذا المنتج؟")){
return;
}

try{

await deleteDoc(
doc(
db,
"products",
btn.dataset.deleteProduct
)
);

await loadProducts();

}catch(error){

console.error(error);
alert("تعذر حذف المنتج.");

}

};

});
}


function startProductEdit(id){

const product=
products.find(p=>p.id===id);

if(!product){
return;
}

editingProductId=id;

$("productFormTitle").textContent=
"تعديل المنتج";

$("productName").value=
product.name || "";

$("productCategory").value=
product.categoryId || "";

$("productPrice").value=
product.price ?? "";

$("productStock").value=
product.stock ?? 0;

$("productDescription").value=
product.description || "";

$("productColors").value=
(product.colors || []).join("، ");

$("productSizes").value=
(product.sizes || []).join("، ");

$("productImage").value=
product.image || "";

$("productActive").checked=
product.active !== false;

$("productNew").checked=
!!product.isNew;

$("productFeatured").checked=
!!product.featured;

$("saveProductBtn").textContent=
"حفظ التعديلات";

$("cancelEditBtn").classList.remove(
"hidden"
);

window.scrollTo({
top:document.body.scrollHeight/3,
behavior:"smooth"
});
}


$("cancelEditBtn").onclick=()=>{

resetProductForm();

};


function resetProductForm(){

editingProductId=null;

$("productFormTitle").textContent=
"إضافة منتج";

$("productName").value="";
$("productCategory").value="";
$("productPrice").value="";
$("productStock").value="0";
$("productDescription").value="";
$("productColors").value="";
$("productSizes").value="";
$("productImage").value="";

$("productActive").checked=true;
$("productNew").checked=false;
$("productFeatured").checked=false;

$("saveProductBtn").textContent=
"حفظ المنتج";

$("cancelEditBtn").classList.add(
"hidden"
);
}


$("refreshProductsBtn").onclick=
loadProducts;


function splitValues(value){

return value
.split(/[,،]/)
.map(x=>x.trim())
.filter(Boolean);

}


function escapeHtml(value=""){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

</script>

</body>
</html>
